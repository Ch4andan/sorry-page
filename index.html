<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry Saswati💔</title>
    <meta name="description" content="A heartfelt apology with love and affection">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a0a1e 0%, #2d1233 25%, #1e0a2e 50%, #2a0e3a 75%, #1a0a1e 100%);
            font-family: 'Quicksand', sans-serif;
            color: #f0d4f7;
            cursor: default;
        }

        /* Starfield background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Floating hearts */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -80px;
            animation: floatUp var(--float-duration) ease-in infinite;
            animation-delay: var(--delay);
            opacity: 0;
            font-size: var(--size);
            filter: drop-shadow(0 0 6px rgba(255, 100, 150, 0.5));
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.5);
            }

            10% {
                opacity: 0.8;
                transform: translateY(-10vh) translateX(10px) rotate(15deg) scale(1);
            }

            50% {
                opacity: 0.6;
                transform: translateY(-50vh) translateX(-20px) rotate(-10deg) scale(0.9);
            }

            90% {
                opacity: 0.3;
                transform: translateY(-90vh) translateX(15px) rotate(20deg) scale(0.7);
            }

            100% {
                opacity: 0;
                transform: translateY(-105vh) translateX(-10px) rotate(0deg) scale(0.5);
            }
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff6b9d, transparent);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #c084fc, transparent);
            top: 50%;
            right: 5%;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f472b6, transparent);
            bottom: 10%;
            left: 30%;
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -20px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(10px, -30px) scale(1.05);
            }
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Intro screen */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a1e, #2d1233);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .intro-screen.hide {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .intro-heart {
            font-size: 80px;
            animation: heartbeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 100, 150, 0.6));
            cursor: pointer;
        }

        .intro-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 22px;
            color: #f0a0c0;
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
            letter-spacing: 2px;
        }

        .intro-tap {
            font-size: 14px;
            color: rgba(240, 160, 192, 0.5);
            margin-top: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards, pulse 2s ease-in-out 2.5s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.1);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Sorry card */
        .sorry-card {
            background: linear-gradient(145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 80px rgba(244, 114, 182, 0.08);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .sorry-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .sorry-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg,
                    #ff6b9d33, #c084fc33, #f472b633, #a855f733);
            border-radius: 31px;
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .sorry-emoji {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: gentleBounce 3s ease-in-out infinite;
        }

        @keyframes gentleBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .sorry-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(48px, 8vw, 72px);
            font-weight: 700;
            background: linear-gradient(135deg, #ff9ec6, #ff6b9d, #f472b6, #ec4899, #c084fc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            margin-bottom: 10px;
            line-height: 1.2;
            text-shadow: none;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .sorry-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #d8a0d0;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.3s forwards;
            font-style: italic;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f472b6, transparent);
            margin: 25px auto;
            border-radius: 2px;
        }

        .sorry-message {
            font-size: 16px;
            line-height: 2;
            color: #e0c0e8;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .sorry-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .sorry-message p {
            margin-bottom: 18px;
        }

        .highlight {
            color: #f9a8d4;
            font-weight: 600;
            position: relative;
        }

        .highlight::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #f472b6, transparent);
        }

        /* Quote section */
        .quote-section {
            margin-top: 40px;
            padding: 30px;
            background: rgba(244, 114, 182, 0.05);
            border-left: 3px solid rgba(244, 114, 182, 0.3);
            border-radius: 0 15px 15px 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.8s ease;
        }

        .quote-section.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-style: italic;
            color: #f0b0d8;
            line-height: 1.8;
        }

        .quote-text::before {
            content: '"';
            font-size: 40px;
            color: #f472b6;
            font-family: 'Playfair Display', serif;
            line-height: 0;
            vertical-align: -12px;
            margin-right: 5px;
        }

        .quote-text::after {
            content: '"';
            font-size: 40px;
            color: #f472b6;
            font-family: 'Playfair Display', serif;
            line-height: 0;
            vertical-align: -12px;
            margin-left: 5px;
        }

        /* Promise section */
        .promises {
            margin-top: 40px;
            text-align: left;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .promises.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .promises-title {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            color: #f9a8d4;
            text-align: center;
            margin-bottom: 25px;
        }

        .promise-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .promise-item:hover {
            background: rgba(244, 114, 182, 0.08);
            border-color: rgba(244, 114, 182, 0.15);
            transform: translateX(5px);
        }

        .promise-icon {
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .promise-text {
            font-size: 15px;
            color: #d8b0e0;
            line-height: 1.6;
        }

        /* Bottom heart */
        .bottom-heart {
            margin-top: 50px;
            font-size: 40px;
            animation: heartbeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 100, 150, 0.5));
            opacity: 0;
            transition: all 0.8s ease;
        }

        .bottom-heart.visible {
            opacity: 1;
        }

        .forever-text {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: #f472b6;
            margin-top: 15px;
            opacity: 0;
            transition: all 0.8s ease;
            letter-spacing: 3px;
        }

        .forever-text.visible {
            opacity: 1;
        }

        /* Petals */
        .petal {
            position: fixed;
            width: 12px;
            height: 16px;
            background: radial-gradient(ellipse at center, #f9a8d4, #f472b6);
            border-radius: 50% 0 50% 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            animation: petalFall var(--fall-duration) ease-in-out infinite;
            animation-delay: var(--fall-delay);
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateY(-20px) translateX(0) rotate(0deg);
            }

            10% {
                opacity: 0.7;
            }

            50% {
                transform: translateY(50vh) translateX(calc(var(--sway) * 1px)) rotate(180deg);
                opacity: 0.5;
            }

            100% {
                opacity: 0;
                transform: translateY(105vh) translateX(calc(var(--sway) * -0.5px)) rotate(360deg);
            }
        }

        /* Sparkle cursor effect */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #f9a8d4);
            animation: sparkleAnim 0.8s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }

            100% {
                opacity: 0;
                transform: scale(0) translate(var(--sx), var(--sy));
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .sorry-card {
                padding: 40px 25px;
                border-radius: 20px;
                margin: 20px;
            }

            .sorry-title {
                font-size: 48px;
            }

            .intro-heart {
                font-size: 60px;
            }

            .quote-section {
                padding: 20px;
            }

            .promise-item {
                padding: 10px 14px;
            }
        }

        /* Music toggle */
        .music-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .music-toggle:hover {
            background: rgba(244, 114, 182, 0.2);
            transform: scale(1.1);
        }

        .music-toggle.show {
            opacity: 1;
        }

        /* Typing effect */
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #f472b6;
            animation: typing 3s steps(30, end), blinkCursor 0.6s step-end infinite;
            display: inline-block;
            max-width: 100%;
        }

        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes blinkCursor {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: #f472b6;
            }
        }

        /* Letter animation */
        .letter-reveal span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: letterIn 0.5s ease forwards;
        }

        @keyframes letterIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Intro Screen -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-heart" id="introHeart">💔</div>
        <div class="intro-text">Tote kichi kahibar achi...</div>
        <div class="intro-tap">heart re click kara</div>
    </div>

    <!-- Background effects -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="stars" id="stars"></div>
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Main Content -->
    <div class="content" id="mainContent">
        <div class="sorry-card" id="sorryCard">
            <div class="sorry-emoji">🥺💔</div>
            <h1 class="sorry-title">I'm Sorry Saswati</h1>
            <p class="sorry-subtitle">Dil Se</p>

            <div class="divider"></div>

            <div class="sorry-message" id="message1">
                <p>
                    Moror kahibar <span class="highlight">mane seia nathila</span>,
                    I am just curious to talk with you.
                </p>
            </div>

            <div class="sorry-message" id="message2">
                <p>
                    Tu reply deluni <span class="highlight">bahut time</span>,
                    so emiti patiru baharigala. 😔
                </p>
            </div>

            <div class="quote-section" id="quoteSection">
                <p class="quote-text">
                    Sorry na please... ragni 🙏💕
                </p>
            </div>

            <div class="divider" style="margin-top: 35px;"></div>

            <div class="sorry-message" id="message3">
                <p>
                    <span class="highlight">Please ragni na</span> 💕
                </p>
            </div>

            <div class="bottom-heart" id="bottomHeart">❤️</div>
            <div class="forever-text" id="foreverText">tora pain sadaa 💕</div>
        </div>
    </div>

    <script>
        // ===== Stars =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        // ===== Floating Hearts =====
        function createFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            const heartEmojis = ['💕', '💖', '💗', '💝', '💘', '❤️', '🩷', '🤍', '💜'];

            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.setProperty('--float-duration', (Math.random() * 8 + 8) + 's');
                heart.style.setProperty('--delay', (Math.random() * 10) + 's');
                heart.style.setProperty('--size', (Math.random() * 20 + 14) + 'px');
                container.appendChild(heart);
            }
        }

        // ===== Rose Petals =====
        function createPetals() {
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.top = -20 + 'px';
                petal.style.setProperty('--fall-duration', (Math.random() * 8 + 10) + 's');
                petal.style.setProperty('--fall-delay', (Math.random() * 12) + 's');
                petal.style.setProperty('--sway', (Math.random() * 100 - 50));
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(petal);
            }
        }

        // ===== Sparkle on mouse move =====
        let lastSparkle = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastSparkle < 80) return;
            lastSparkle = now;

            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            sparkle.style.setProperty('--sx', (Math.random() * 40 - 20) + 'px');
            sparkle.style.setProperty('--sy', (Math.random() * 40 - 20) + 'px');
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        });

        // ===== Intro Screen =====
        const introScreen = document.getElementById('introScreen');
        const introHeart = document.getElementById('introHeart');

        introHeart.addEventListener('click', () => {
            introScreen.classList.add('hide');
            setTimeout(() => {
                introScreen.style.display = 'none';
                revealContent();
            }, 1500);
        });

        // ===== Reveal Content with Scroll Animations =====
        function revealContent() {
            const card = document.getElementById('sorryCard');
            setTimeout(() => card.classList.add('visible'), 300);

            // Sequential reveal
            const reveals = [
                { id: 'message1', delay: 1200 },
                { id: 'message2', delay: 2500 },
                { id: 'quoteSection', delay: 3800 },
                { id: 'message3', delay: 5000 },
                { id: 'bottomHeart', delay: 6000 },
                { id: 'foreverText', delay: 6500 },
            ];

            reveals.forEach(({ id, delay }) => {
                setTimeout(() => {
                    document.getElementById(id).classList.add('visible');
                }, delay);
            });
        }

        // ===== Initialize =====
        createStars();
        createFloatingHearts();
        createPetals();

        // ===== Scroll reveal for elements that might be below fold =====
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        // ===== Touch support for mobile =====
        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = (touch.clientX + Math.random() * 30 - 15) + 'px';
                    sparkle.style.top = (touch.clientY + Math.random() * 30 - 15) + 'px';
                    sparkle.style.setProperty('--sx', (Math.random() * 40 - 20) + 'px');
                    sparkle.style.setProperty('--sy', (Math.random() * 40 - 20) + 'px');
                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 800);
                }, i * 50);
            }
        });

        // Prevent default zoom on double tap for mobile
        document.addEventListener('dblclick', (e) => e.preventDefault());
    </script>
</body>

</html>
